# Build + deploy the docs to GitHub Pages.
#
# Prerequisites (one-time):
#   1. Repo → Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   2. For a PROJECT site (pyshka501.github.io/care-docs), set in astro.config.mjs:
#        site: 'https://pyshka501.github.io', base: '/care-docs'
#      For a custom domain / Vercel / Netlify, drop `base` and adjust `site`.
#   3. GitHub Pages on a PRIVATE repo requires GitHub Pro/Team — otherwise make
#      the repo public, or deploy to Vercel/Netlify instead.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
